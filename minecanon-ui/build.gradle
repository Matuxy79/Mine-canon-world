plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.johnmatukutire.minecanon'

base { archivesName = 'minecanon-ui' }

// OneDrive-synced repositories stall Gradle's file handling; allow the build
// directory to live outside the project (set MINECANON_BUILD_DIR to use it).
if (System.getenv('MINECANON_BUILD_DIR')) {
    buildDir = System.getenv('MINECANON_BUILD_DIR')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { minecanon { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.26'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'minecanon',
            'Specification-Version': '1',
            'Implementation-Title': 'MineCanon UI',
            'Implementation-Version': project.version
        ])
    }
}
